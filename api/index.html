<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>机器人训练控制台</title>
<style>
  :root{
    --bg:#e9edee;--surface:#fff;--ink:#12201e;--muted:#5b6a6d;--faint:#8b9a9c;--line:#d6dedf;--line2:#e8eeef;
    --accent:#0b8f8a;--ok:#2e8b57;--warn:#a9741a;--crit:#c23a56;
    --term-bg:#0e1a1b;--term-line:#20302f;--term-ink:#c4d6d3;--term-dim:#7f9793;--term-accent:#33d3c6;--term-mono:#8fc9c3;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Roboto,sans-serif;
    --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;--r:9px;
  }
  *{box-sizing:border-box}html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1180px;margin:0 auto;padding:0 20px 64px}
  header{display:flex;align-items:center;gap:14px;padding:22px 0 20px}
  .logo{width:34px;height:34px;border-radius:8px;background:var(--ink);display:grid;place-items:center;flex:none}
  .logo span{display:block;width:15px;height:15px;border:2.4px solid var(--term-accent);border-radius:3px;border-top-color:transparent;transform:rotate(45deg)}
  .brand h1{font-size:16px;margin:0;letter-spacing:-.01em;font-weight:640}.brand p{margin:1px 0 0;font-size:12px;color:var(--muted)}
  header .spacer{flex:1}
  .gpu{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:5px 11px 5px 9px}
  .gpu b{color:var(--ink);font-weight:600}.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none;box-shadow:0 0 0 3px rgba(46,139,87,.16)}
  .grid{display:grid;grid-template-columns:1fr 420px;gap:20px;align-items:start}@media(max-width:900px){.grid{grid-template-columns:1fr}}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
  section.card{padding:18px 20px}section.card+section.card{margin-top:16px}
  .sec-head{display:flex;align-items:baseline;gap:10px;margin:0 0 15px}.sec-head h2{font-size:13px;margin:0;font-weight:640}.sec-head .k{font-family:var(--mono);font-size:10.5px;color:var(--faint);letter-spacing:.06em}
  .hint{font-size:12px;color:var(--muted);margin:-6px 0 14px}
  .field{margin-bottom:16px}.field:last-child{margin-bottom:0}
  label.lab{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;margin-bottom:8px}
  label.lab .sub{text-transform:none;letter-spacing:0;color:var(--faint);font-weight:500;margin-left:6px}
  .sel{position:relative}
  .sel select{appearance:none;-webkit-appearance:none;font:inherit;font-size:14px;font-weight:520;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 36px 10px 12px;width:100%;cursor:pointer}
  .sel select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .sel::after{content:"";position:absolute;right:14px;top:50%;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}
  .seg{display:inline-flex;background:#eef2f2;border:1px solid var(--line);border-radius:8px;padding:3px;gap:2px;flex-wrap:wrap}
  .seg button{font:inherit;font-size:13px;border:0;background:transparent;color:var(--muted);padding:6px 13px;border-radius:6px;cursor:pointer;white-space:nowrap;font-weight:520}
  .seg button .meta{font-size:10.5px;color:var(--faint);margin-left:6px;font-family:var(--mono)}
  .seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.07);font-weight:600}
  .seg button[aria-pressed=true] .meta{color:var(--accent)}
  .toggle-row{display:flex;align-items:center;justify-content:space-between;gap:16px}.toggle-row .tt{font-size:13.5px;font-weight:560}.toggle-row .td{font-size:12px;color:var(--muted);margin-top:2px;max-width:44ch}
  .sw{position:relative;width:44px;height:25px;flex:none;cursor:pointer}.sw input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
  .sw .track{position:absolute;inset:0;background:#cdd6d7;border-radius:99px;transition:.16s}.sw .knob{position:absolute;top:3px;left:3px;width:19px;height:19px;background:#fff;border-radius:50%;transition:.16s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
  .sw input:checked+.track{background:var(--accent)}.sw input:checked+.track+.knob{transform:translateX(19px)}.sw.locked{opacity:.55;cursor:not-allowed}.sw.locked input{cursor:not-allowed}
  input.txt,input.num{font:inherit;font-family:var(--mono);font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:7px 9px;width:100%}
  input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .inline{display:flex;gap:10px}.inline .field{flex:1;margin:0}
  .zone{border:1px solid var(--line2);border-radius:8px;padding:13px 14px;margin-bottom:11px;background:#fafcfc}.zone:last-child{margin-bottom:0}
  .zone-h{font-size:12px;font-weight:640;margin-bottom:11px}
  .axis{display:grid;grid-template-columns:64px 1fr 1fr;gap:10px;align-items:center;margin-bottom:9px}.axis:last-child{margin-bottom:0}
  .axis .ax{font-size:11.5px;color:var(--muted);font-weight:600}.axis .ax .u{font-family:var(--mono);font-size:9.5px;color:var(--faint);display:block;font-weight:500}
  .axis .mini{grid-column:1/-1;height:4px;background:#e2eae9;border-radius:99px;position:relative;margin:1px 0 3px}.axis .mini i{position:absolute;top:0;height:100%;background:var(--accent);border-radius:99px}
  .axis.bad input{border-color:var(--crit)}.axis.bad .mini i{background:var(--crit)}
  .preview{position:sticky;top:16px;background:var(--term-bg);border:1px solid var(--term-line);border-radius:var(--r);overflow:hidden;color:var(--term-ink)}
  .pv-head{display:flex;align-items:center;gap:8px;padding:13px 16px;border-bottom:1px solid var(--term-line)}
  .pv-head .lights{display:flex;gap:6px}.pv-head .lights i{width:10px;height:10px;border-radius:50%;background:#2b3d3c}
  .pv-head h3{font-size:12px;margin:0;font-weight:560;color:var(--term-dim);font-family:var(--mono)}
  .pv-body{padding:15px 16px}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:15px}
  .chip{font-family:var(--mono);font-size:11px;padding:4px 9px;border-radius:6px;border:1px solid var(--term-line);color:var(--term-dim);display:flex;align-items:center;gap:6px}
  .chip b{color:var(--term-ink);font-weight:500}.chip.on{border-color:rgba(51,211,198,.4);color:var(--term-accent)}.chip.on b{color:var(--term-accent)}
  .chip.warn{border-color:rgba(169,116,26,.5);color:#d9a441}.chip.crit{border-color:rgba(194,58,86,.55);color:#ef6b85}
  .pv-label{font-size:10px;text-transform:uppercase;letter-spacing:.11em;color:var(--term-dim);margin:0 0 7px}
  pre.block{margin:0 0 16px;font-family:var(--mono);font-size:12px;line-height:1.6;color:var(--term-mono);white-space:pre-wrap;word-break:break-word;background:#0a1414;border:1px solid var(--term-line);border-radius:7px;padding:12px 13px;max-height:220px;overflow:auto}
  pre.block .key{color:var(--term-dim)}pre.block .flag{color:var(--term-accent)}pre.block .val{color:#e4b96b}
  .err{background:rgba(194,58,86,.09);border:1px solid rgba(194,58,86,.4);border-radius:7px;padding:10px 12px;margin-bottom:15px;font-size:12px;color:#f0a6b4;white-space:pre-wrap}
  .run{width:100%;font:inherit;font-weight:640;font-size:14px;color:#04100f;background:var(--term-accent);border:0;border-radius:8px;padding:12px;cursor:pointer}
  .run:hover{background:#4be0d3}.run:disabled{background:#26403e;color:var(--term-dim);cursor:not-allowed}
  .run-note{font-size:11px;color:var(--term-dim);text-align:center;margin:9px 0 0;font-family:var(--mono);white-space:pre-wrap}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body>
<div class="wrap">
  <header>
    <div class="logo"><span></span></div>
    <div class="brand"><h1>机器人训练控制台</h1><p>选机器人和任务、调参数、一键开跑 —— 训练在集群 GPU 上,checkpoint 存 TOS</p></div>
    <div class="spacer"></div>
    <div class="gpu"><span class="dot"></span>算力 <b>NVIDIA A30</b> · 就绪</div>
  </header>
  <div class="grid">
    <div>
      <section class="card">
        <div class="sec-head"><h2>机器人与任务</h2><span class="k">robot · task</span></div>
        <div class="inline">
          <div class="field"><label class="lab">机器人</label><div class="sel"><select id="dd-robot"></select></div></div>
          <div class="field"><label class="lab">任务</label><div class="sel"><select id="dd-task"></select></div></div>
        </div>
        <p class="hint" id="task-desc" style="margin:14px 0 0"></p>
      </section>
      <section class="card">
        <div class="sec-head"><h2 id="goal-title">目标设置</h2><span class="k" id="goal-key">goal</span></div>
        <p class="hint">拖动/输入定义任务范围,超出可行域会被拦下。</p>
        <div id="goal-zones"></div>
      </section>
      <section class="card">
        <div class="sec-head"><h2>训练方式</h2><span class="k">budget · behavior</span></div>
        <div class="field"><label class="lab">训练时长 <span class="sub">档位越高越久、效果越好</span></label><div class="seg" id="seg-budget"></div></div>
        <div class="field"><label class="lab">行为偏好</label><div class="seg" id="seg-behavior"></div></div>
      </section>
      <section class="card">
        <div class="sec-head"><h2>迁移与产出</h2><span class="k">sim2real · output</span></div>
        <div class="field toggle-row"><div><div class="tt">真机稳健性</div><div class="td" id="dr-desc"></div></div>
          <label class="sw" id="sw-sim2real"><input type="checkbox" id="sim2real" checked><span class="track"></span><span class="knob"></span></label></div>
        <div class="field toggle-row" style="margin-top:16px"><div><div class="tt">录制训练视频</div><div class="td">周期性把仿真画面录成视频。</div></div>
          <label class="sw"><input type="checkbox" id="video"><span class="track"></span><span class="knob"></span></label></div>
        <div class="inline" style="margin-top:16px">
          <div class="field"><label class="lab">输出名称</label><input class="txt" id="output" value="my_reach_v1"></div>
          <div class="field" style="max-width:120px"><label class="lab">随机种子</label><input class="num" id="seed" type="number" value="42"></div>
        </div>
      </section>
    </div>
    <div class="preview">
      <div class="pv-head"><div class="lights"><i></i><i></i><i></i></div><h3>run preview</h3></div>
      <div class="pv-body">
        <div class="chips" id="chips"></div>
        <div id="errbox"></div>
        <div class="pv-label">将执行的命令</div>
        <pre class="block" id="cmd">加载中…</pre>
        <button class="run" id="run">▶ 开始训练</button>
        <p class="run-note" id="runnote">训练将作为 K8s Job 在空闲 A30 上起</p>
      </div>
    </div>
  </div>
</div>
<script>
"use strict";
const BUDGET_LABEL={quick:"快速试跑",standard:"标准",thorough:"精细"};
const BUDGET_ETA={quick:"约几分钟",standard:"约 1 小时",thorough:"约数小时"};
const BEHAVIOR_LABEL={balanced:"均衡",precise:"精准",smooth:"平滑"};
let CAT=null, ROBOTS={}, TASKS={}, BUDGETS={};
const S={robot:null,task:null,budget:"standard",behavior:"balanced",sim2real:true,video:false,output:"",seed:42,goal:{}};
const el=id=>document.getElementById(id);
const near=n=>Number.isInteger(n)?n:parseFloat(n.toFixed(4));
function robotDR(){return ROBOTS[S.robot].dr;}
function initGoal(){S.goal={};const z=TASKS[S.task].goal_zones;for(const zn in z){S.goal[zn]={};for(const ax in z[zn].axes)S.goal[zn][ax]=z[zn].axes[ax].default.slice();}}

function req(){return {robot:S.robot,task:S.task,training_budget:S.budget,behavior:S.behavior,
  sim2real_robustness:robotDR()===true?S.sim2real:(robotDR()==="builtin"),record_video:S.video,
  seed:S.seed,output_name:S.output,goal:S.goal};}

function fillRobots(){const dd=el("dd-robot");dd.innerHTML="";const g={};
  for(const r in ROBOTS)(g[ROBOTS[r].group]=g[ROBOTS[r].group]||[]).push(r);
  for(const grp in g){const og=document.createElement("optgroup");og.label=grp;
    g[grp].forEach(r=>{const o=document.createElement("option");o.value=r;o.textContent=ROBOTS[r].name;og.appendChild(o);});dd.appendChild(og);}
  dd.value=S.robot;}
function fillTasks(){const dd=el("dd-task");dd.innerHTML="";
  Object.keys(ROBOTS[S.robot].tasks).forEach(tk=>{const o=document.createElement("option");o.value=tk;o.textContent=TASKS[tk].name;dd.appendChild(o);});
  if(!ROBOTS[S.robot].tasks[S.task])S.task=Object.keys(ROBOTS[S.robot].tasks)[0];dd.value=S.task;}
function segify(c,opts,cur,on){c.innerHTML="";opts.forEach(o=>{const b=document.createElement("button");b.type="button";
  b.innerHTML=o.label+(o.meta?`<span class="meta">${o.meta}</span>`:"");b.setAttribute("aria-pressed",o.val===cur);b.onclick=()=>on(o.val);c.appendChild(b);});}
function renderBB(){segify(el("seg-budget"),Object.keys(BUDGETS).map(v=>({val:v,label:BUDGET_LABEL[v]||v,meta:BUDGET_ETA[v]||""})),S.budget,v=>{S.budget=v;update();});
  const bh=Object.keys(TASKS[S.task].behavior_presets);if(!bh.includes(S.behavior))S.behavior="balanced";
  segify(el("seg-behavior"),bh.map(v=>({val:v,label:BEHAVIOR_LABEL[v]||v})),S.behavior,v=>{S.behavior=v;update();});}
function renderGoal(){const z=TASKS[S.task].goal_zones,host=el("goal-zones");host.innerHTML="";
  el("goal-key").textContent=Object.keys(z).length>1?"goal · zones":"goal";el("goal-title").textContent=S.task==="velocity"?"速度设置":"目标设置";
  for(const zn in z){const zc=document.createElement("div");zc.className="zone";let ax="";
    for(const a in z[zn].axes){const sp=z[zn].axes[a],[lo,hi]=S.goal[zn][a],nm=sp.name||a.toUpperCase();
      ax+=`<div class="axis" data-zn="${zn}" data-ax="${a}"><div class="ax">${nm}<span class="u">${sp.unit}</span></div>
        <input class="num" type="number" step="0.05" value="${lo}" data-r="lo"><input class="num" type="number" step="0.05" value="${hi}" data-r="hi"><div class="mini"><i></i></div></div>`;}
    zc.innerHTML=`<div class="zone-h">${z[zn].label}</div>${ax}`;host.appendChild(zc);}
  host.querySelectorAll(".num").forEach(inp=>inp.addEventListener("input",e=>{const a=e.target.closest(".axis");
    S.goal[a.dataset.zn][a.dataset.ax][e.target.dataset.r==="lo"?0:1]=parseFloat(e.target.value);update();}));}
function renderMini(){const z=TASKS[S.task].goal_zones;document.querySelectorAll(".axis").forEach(a=>{
  const sp=z[a.dataset.zn].axes[a.dataset.ax],lim=sp.limits;let[lo,hi]=S.goal[a.dataset.zn][a.dataset.ax];
  const span=lim[1]-lim[0],bar=a.querySelector(".mini i"),bad=isNaN(lo)||isNaN(hi)||lo>hi||lo<lim[0]||hi>lim[1];
  a.classList.toggle("bad",bad);if(bad){bar.style.width="0";return;}bar.style.left=((lo-lim[0])/span*100)+"%";bar.style.width=Math.max(2,(hi-lo)/span*100)+"%";});}
function syncDR(){const dr=robotDR(),sw=el("sw-sim2real"),cb=el("sim2real"),d=el("dr-desc");
  if(dr===true){sw.classList.remove("locked");cb.disabled=false;cb.checked=S.sim2real;d.textContent="开启物理域随机化,让策略更容易迁移到真实机器人。";}
  else if(dr==="builtin"){sw.classList.add("locked");cb.disabled=true;cb.checked=true;d.textContent="该任务已内置域随机化,默认开启。";}
  else{sw.classList.add("locked");cb.disabled=true;cb.checked=false;d.textContent="该任务暂未接入域随机化(目前仅 SO-ARM)。";}}
function chip(cls,l,v){return `<span class="chip ${cls}">${l}<b>${v}</b></span>`;}
function colorCmd(p){return p.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/(--[a-z_]+)/g,'<span class="flag">$1</span>').replace(/([\w.]+)=(\[[^\]]*\]|[-\d.]+|Isaac-[\w-]+)/g,'<span class="key">$1</span>=<span class="val">$2</span>');}

let vT, lastOk=false;
function update(){
  renderMini();
  const dr=robotDR();const b=BUDGETS[S.budget];
  let h=chip("","任务 ",ROBOTS[S.robot].tasks[S.task])+chip("","规模 ",b.num_envs+"env × "+b.max_iterations+"it")+chip("","预计 ",BUDGET_ETA[S.budget]||"");
  h+= dr==="builtin"?chip("on","真机稳健 ","内置"):dr===false?chip("warn","真机稳健 ","无"):S.sim2real?chip("on","真机稳健 ","开"):chip("warn","真机稳健 ","关");
  el("task-desc").textContent=TASKS[S.task].desc||"";
  clearTimeout(vT);vT=setTimeout(async()=>{
    const r=await (await fetch("/api/validate",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(req())})).json();
    lastOk=r.ok;
    if(r.ok){el("cmd").innerHTML=colorCmd(r.command);el("errbox").innerHTML="";el("chips").innerHTML=h+chip("on","校验 ","✓ 通过");}
    else{el("errbox").innerHTML=`<div class="err">${r.errors}</div>`;el("chips").innerHTML=h+chip("crit","校验 ","✕");}
    el("run").disabled=!r.ok;el("runnote").textContent=r.ok?`训练将作为 K8s Job 在空闲 A30 上起 · ${BUDGET_ETA[S.budget]||""}`:"修正配置后即可开始";
  },200);
  el("chips").innerHTML=h;
}
function rerender(){fillTasks();initGoal();S.output=`my_${S.task}_v1`;el("output").value=S.output;renderBB();renderGoal();syncDR();update();}

el("dd-robot").addEventListener("change",e=>{S.robot=e.target.value;rerender();});
el("dd-task").addEventListener("change",e=>{S.task=e.target.value;initGoal();S.output=`my_${S.task}_v1`;el("output").value=S.output;renderBB();renderGoal();syncDR();update();});
el("sim2real").addEventListener("change",e=>{if(robotDR()===true){S.sim2real=e.target.checked;update();}});
el("video").addEventListener("change",e=>{S.video=e.target.checked;update();});
el("output").addEventListener("input",e=>{S.output=e.target.value;update();});
el("seed").addEventListener("input",e=>{S.seed=parseInt(e.target.value||"0",10);update();});

let poll=null;
async function startTrain(){
  el("run").disabled=true;el("run").textContent="提交中…";
  try{
    const r=await fetch("/api/train",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(req())});
    if(!r.ok){const e=await r.json();el("run").textContent="▶ 开始训练";el("runnote").textContent="提交失败:"+(e.detail||r.status);el("run").disabled=false;return;}
    const {job}=await r.json();
    el("run").textContent="✓ 已提交";el("runnote").textContent="Job: "+job+" · 排队/运行中…";
    clearInterval(poll);poll=setInterval(async()=>{
      const s=await (await fetch("/api/jobs/"+job)).json();
      el("runnote").textContent=`Job: ${job} · ${s.phase}`;
      if(s.logs)el("cmd").textContent=s.logs;
      if(s.succeeded||s.failed){clearInterval(poll);el("run").textContent=s.succeeded?"✓ 训练完成":"✗ 训练失败";
        el("runnote").textContent=`Job: ${job} · ${s.phase}` + (s.succeeded?" · checkpoint 已传 TOS":"");
        setTimeout(()=>{el("run").textContent="▶ 开始训练";el("run").disabled=false;update();},4000);}
    },5000);
  }catch(err){el("run").textContent="▶ 开始训练";el("runnote").textContent="请求出错:"+err;el("run").disabled=false;}
}
el("run").addEventListener("click",startTrain);

(async function init(){
  CAT=await (await fetch("/api/catalog")).json();
  ROBOTS=CAT.robots;TASKS=CAT.tasks;BUDGETS=CAT.budgets;
  S.robot=Object.keys(ROBOTS)[0];S.task=Object.keys(ROBOTS[S.robot].tasks)[0];S.output=`my_${S.task}_v1`;el("output").value=S.output;
  fillRobots();fillTasks();initGoal();renderBB();renderGoal();syncDR();update();
})();
</script>
</body></html>
