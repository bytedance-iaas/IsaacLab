# Isaac Lab training. Nothing is exposed — exec into the pod and launch a run.
#
#   helm install isaaclab-train ./docker/charts \
#     -f docker/charts/examples/values-train.yaml \
#     --set image.tag=<tag>
#
# Values below are for the Volcengine test cluster; adjust for anywhere else.

mode: train

image:
  repository: iaas-us-cn-beijing.cr.volces.com/physicalai/isaaclab
  # Left to the command line: builds are tagged per commit and there is no `latest`.
  tag: ""

# No node pin. The GPU request is what schedules the pod, and training does not need the
# display engine that rendering does — so any GPU node in the cluster will do.
#
# Pin it only to reach specific hardware, e.g.:
#   nodeSelector: { node.kubernetes.io/instance-type: ecs.gna3c.7xlarge }
nodeSelector: {}

resources:
  requests: { cpu: "8", memory: 64Gi, nvidia.com/gpu: "1" }
  limits:   { cpu: "32", memory: 256Gi, nvidia.com/gpu: "1" }

persistence:
  storageClass: ebs-essd
  size: 500Gi
  # NOT under /workspace/isaaclab — a volume there would hide the Isaac Lab install.
  # Write checkpoints and logs here so they outlive the pod.
  mountPath: /data

dshmSize: 16Gi

# Checkpoint upload (TOS) reads its credentials here. Optional, so a missing Secret does not
# block startup.
envFromSecrets:
  - tos-creds

# Publishing a live training view (train.py --stream) to a LiveKit server owned by ANOTHER
# release. This one brings up no server: LiveKit is shared infrastructure and one per training run
# would defeat the point. To bring the server up, use values-train-with-livekit.yaml.
#
# Leave url empty to fall back to the default compiled into livekit_stream.py.
#
# ⚠️ --stream RENDERS a camera view, so a run using it needs a GPU with rendering capability, not
#    just compute — and this file pins no node. Pin an instance type valid for both modes if runs
#    from here will use --stream.
stream:
  # The in-cluster address of the server, not its public VIP: the publisher runs inside the
  # cluster, so the public address would be a hairpin.
  url: ws://livekit-clb.default.svc.cluster.local:7880
  # The Secret that server's own release created, holding LiveKit's `keys` format. Reading the
  # same object as the server is what keeps the two ends from drifting apart.
  existingSecret: livekit-auth
