# Training, PLUS the shared LiveKit server that training runs publish their live view to.
#
#   helm dependency update ./docker/charts
#   helm install isaaclab-train ./docker/charts \
#     -f docker/charts/examples/values-train-with-livekit.yaml \
#     --set image.tag=<tag> \
#     --set livekit.auth.keys="devkey: $(openssl rand -hex 32)" \
#     --set livekit.service.subnetId=<subnet-in-this-vpc>
#
# ⚠️ USE THIS FOR EXACTLY ONE RELEASE. LiveKit is shared infrastructure: one server serves many
#    training runs, which is the whole reason this path beats exposing each run directly. Every
#    other training release should use values-train.yaml and point at the server this one brought
#    up. A server per run means N servers and N load balancers — worse than no LiveKit at all.
#
# ⚠️ The credentials go into the Helm release history verbatim, readable by anyone who can run
#    `helm get values`. The livekit chart takes them this way on purpose — it is installed from
#    the VKE console's Helm page, which has no shell, so creating a Secret beforehand is not
#    possible there. Use a dedicated key rather than one shared with anything else.
#
# Values below are for the Volcengine test cluster; adjust for anywhere else.

mode: train

image:
  repository: iaas-us-cn-beijing.cr.volces.com/physicalai/isaaclab
  tag: ""

# ⚠️ A training run that uses --stream RENDERS a camera view, so it needs a GPU with rendering
# capability — not just compute. If runs on this release will use --stream, pin an instance type
# valid for both modes; ecs.gna3c.7xlarge (L20) is the one verified so far.
nodeSelector:
  node.kubernetes.io/instance-type: ecs.gna3c.7xlarge

resources:
  requests: { cpu: "8", memory: 64Gi, nvidia.com/gpu: "1" }
  limits:   { cpu: "32", memory: 256Gi, nvidia.com/gpu: "1" }

persistence:
  storageClass: ebs-essd
  size: 500Gi
  mountPath: /data

dshmSize: 16Gi

# Nothing to set: the publisher is pointed at the server below automatically, and reads the same
# Secret that server does.
stream: {}

livekit:
  # Bring the server up here. Leave this false on every other training release.
  enabled: true
  # auth.keys and service.subnetId are REQUIRED and deliberately not in this file — pass them at
  # install time (see the header) so a working key never sits in the repository.
  service:
    addressType: internet
    # That public IP is baked into every viewer's URL, and deleting the CLB does not give the
    # address back. Keep it.
    keepOnUninstall: true

envFromSecrets:
  - tos-creds

# --stream needs a GPU that can render, so a release whose runs use it must sit on hardware valid
# for both. Only the L20 is confirmed so far.
hardware:
  renderInstanceTypes:
    - ecs.gna3c.7xlarge
  trainInstanceTypes:
    - ecs.gna3c.7xlarge
