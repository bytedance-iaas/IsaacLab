{{/*
Headless Service. The StatefulSet requires one for stable per-pod DNS
(<release>-0.<release>.<namespace>.svc). Carries no external traffic in either mode.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "isaaclab.fullname" . }}
  labels:
    {{- include "isaaclab.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "isaaclab.selectorLabels" . | nindent 4 }}
  ports:
    # A headless Service still needs a port entry to be valid. Nothing listens on it.
    - name: placeholder
      port: 1
