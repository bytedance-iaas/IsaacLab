# Robot catalog: robot -> supported tasks (task type -> registered task id) and DR capability.
# dr: true    = switchable domain randomization is wired up (SO-ARM, added by us)
#     false   = this robot's tasks have no DR wired up yet (stock tasks)
#     builtin = the task ships its own DR, always on, not switchable (e.g. locomotion)
# Adding a robot = another entry here; adding a task type = another profile under tasks/.

so101:
  name: SO-ARM101
  group: Arm
  dr: true
  tasks:
    reach: Isaac-SO-ARM101-Reach-v0
    lift: Isaac-SO-ARM101-Lift-Cube-v0

so100:
  name: SO-ARM100
  group: Arm
  dr: true
  tasks:
    reach: Isaac-SO-ARM100-Reach-v0
    lift: Isaac-SO-ARM100-Lift-Cube-v0

franka:
  name: Franka Panda
  group: Arm
  dr: false
  tasks:
    reach: Isaac-Reach-Franka-v0
    lift: Isaac-Lift-Cube-Franka-v0

ur10:
  name: UR10
  group: Arm
  dr: false
  tasks:
    reach: Isaac-Reach-UR10-v0

anymal_c:
  name: Anymal-C
  group: Quadruped
  dr: builtin
  tasks:
    velocity: Isaac-Velocity-Flat-Anymal-C-v0
