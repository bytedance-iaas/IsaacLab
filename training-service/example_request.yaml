# Example training request (what the frontend form produces / what the user fills in the console).
# Two layers: the common base plus a task-specific section (goal).

# --- Common base ---
robot: so101                 # see profiles/robots.yaml (so100/so101/franka/ur10/anymal_c)
task: reach                  # a task this robot supports (see robots.yaml)
training_budget: standard    # quick | standard | thorough
sim2real_robustness: true    # physics domain randomization (switchable only for robots with dr: true)
record_video: false
seed: 42
output_name: my_reach_v1
behavior: balanced           # balanced | precise | smooth (depends on the task profile)

# --- Task-specific section (reach: goal area; lift and velocity differ, see tasks/<task>.yaml) ---
goal:
  target_zone:
    x: [-0.10, 0.10]
    y: [-0.25, -0.10]
    z: [0.10, 0.30]

# --- Advanced (optional): extra Hydra overrides, passed through verbatim ---
advanced:
  overrides: []
