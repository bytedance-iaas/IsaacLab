<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>训练画面</title>
<style>
  :root{
    --bg:#0c0f10; --panel:#14191a; --line:#232b2d; --ink:#e6edee; --muted:#8b9a9c;
    --live:#3ddc97; --warn:#e0a458; --err:#e06c75;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Roboto,"PingFang SC",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);display:flex;flex-direction:column}
  header{display:flex;align-items:baseline;gap:12px;padding:18px 24px;border-bottom:1px solid var(--line)}
  h1{font-size:16px;font-weight:600;margin:0;letter-spacing:.02em}
  .sub{font-size:12px;color:var(--muted)}
  main{flex:1;padding:24px;overflow:auto}
  .hint{color:var(--muted);font-size:13px;line-height:1.8}
  .rooms{display:flex;flex-direction:column;gap:10px;max-width:680px}
  .room{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--panel);
        border:1px solid var(--line);border-radius:8px;cursor:pointer;text-align:left;
        color:inherit;font:inherit;transition:border-color .15s}
  .room:hover{border-color:#3a4749}
  .room:disabled{cursor:default;opacity:.55}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
  .dot.live{background:var(--live);box-shadow:0 0 0 3px rgba(61,220,151,.15)}
  .rname{flex:1;font-size:14px;word-break:break-all}
  .meta{font-size:12px;color:var(--muted);flex:none}
  .stage{display:flex;flex-direction:column;gap:12px;height:100%}
  .bar{display:flex;align-items:center;gap:14px}
  button.plain{background:transparent;border:1px solid var(--line);color:var(--ink);
               padding:7px 14px;border-radius:7px;cursor:pointer;font:inherit;font-size:13px}
  button.plain:hover{border-color:#3a4749}
  video{width:100%;flex:1;min-height:0;background:#000;border-radius:8px;border:1px solid var(--line)}
  .status{font-size:13px;color:var(--muted)}
  .status.err{color:var(--err)}
  .status.warn{color:var(--warn)}
  footer{padding:12px 24px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}
</style>
</head>
<body>
<header>
  <h1>训练画面</h1>
  <span class="sub" id="head-sub">正在推流的训练</span>
</header>

<main>
  <section id="list-view">
    <div class="rooms" id="rooms"></div>
    <p class="hint" id="list-hint"></p>
  </section>

  <section id="watch-view" hidden class="stage">
    <div class="bar">
      <button class="plain" id="back">← 返回列表</button>
      <span class="rname" id="watch-name"></span>
      <span class="status" id="watch-status"></span>
    </div>
    <video id="video" autoplay playsinline muted></video>
  </section>
</main>

<footer id="ver"></footer>

<script src="/static/livekit-client.umd.min.js"></script>
<script>
const $ = (id) => document.getElementById(id);
let room = null, poll = null, pictureTimer = null, reconnectTimer = null;
let leaving = false, attempt = 0;

function show(which) {
  $("list-view").hidden = which !== "list";
  $("watch-view").hidden = which !== "watch";
  $("head-sub").textContent = which === "list" ? "正在推流的训练" : "";
}

function fmtAge(sec) {
  if (!sec) return "";
  const m = Math.floor(sec / 60);
  if (m < 60) return `已运行 ${m} 分钟`;
  return `已运行 ${Math.floor(m / 60)} 小时 ${m % 60} 分钟`;
}

async function refresh() {
  let data;
  try {
    const res = await fetch("/api/rooms");
    data = await res.json();
    if (!res.ok) throw new Error(data.error || res.status);
  } catch (e) {
    $("rooms").innerHTML = "";
    $("list-hint").innerHTML = `<span style="color:var(--err)">读取房间列表失败:${e.message}</span>`;
    return;
  }

  const rooms = data.rooms || [];
  $("rooms").innerHTML = "";
  for (const r of rooms) {
    const btn = document.createElement("button");
    btn.className = "room";
    btn.disabled = !r.live;
    btn.innerHTML = `<span class="dot ${r.live ? "live" : ""}"></span>
                     <span class="rname"></span>
                     <span class="meta">${r.live ? fmtAge(r.ageSeconds) : "无画面"}</span>`;
    btn.querySelector(".rname").textContent = r.name;
    btn.addEventListener("click", () => watch(r.name));
    $("rooms").appendChild(btn);
  }
  $("list-hint").textContent = rooms.length
    ? ""
    : "当前没有训练在推流。训练命令需要加上 --stream。";
}

function watch(name) {
  clearInterval(poll);
  leaving = false;
  attempt = 0;
  $("watch-name").textContent = name;
  show("watch");
  connectTo(name);
}

async function connectTo(name) {
  setStatus(attempt ? `重连中(第 ${attempt} 次)…` : "连接中…");
  try {
    // A fresh token on every attempt, which is also why an expired one never becomes a problem:
    // tokens are only checked when joining, so each reconnect simply arrives with a new one.
    const res = await fetch(`/api/token?room=${encodeURIComponent(name)}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || res.status);

    room = new LivekitClient.Room({ adaptiveStream: true });
    room.on(LivekitClient.RoomEvent.TrackSubscribed, (track) => {
      if (track.kind !== "video") return;
      track.attach($("video"));
      clearTimeout(pictureTimer);
      setStatus("画面已连接");
    });
    room.on(LivekitClient.RoomEvent.Disconnected, () => {
      if (leaving) return;   // the viewer pressed back; nothing to recover from
      scheduleReconnect(name);
    });

    await room.connect(data.url, data.token);
    attempt = 0;
    setStatus("已连上房间,等待画面…");

    // Signalling succeeds over TCP while media comes in over UDP, so a blocked UDP port looks
    // exactly like a healthy connection that never paints. Say so instead of showing black.
    clearTimeout(pictureTimer);
    pictureTimer = setTimeout(() => {
      if (!$("video").srcObject) {
        setStatus("已连上但没有画面 — 可能是网络阻断了 UDP 媒体端口(47998)", "warn");
      }
    }, 15000);
  } catch (e) {
    if (leaving) return;
    setStatus("连接失败:" + e.message, "err");
    scheduleReconnect(name);
  }
}

function scheduleReconnect(name) {
  clearTimeout(reconnectTimer);
  attempt += 1;
  // Backs off to half a minute: a training that ended is not coming back, and hammering the
  // service adds nothing. The viewer can go back to the list at any point.
  const delay = Math.min(30000, 2000 * 2 ** (attempt - 1));
  setStatus(`连接断开,${Math.round(delay / 1000)} 秒后重连…`, "warn");
  reconnectTimer = setTimeout(() => connectTo(name), delay);
}

function setStatus(text, kind) {
  const el = $("watch-status");
  el.textContent = text;
  el.className = "status" + (kind ? " " + kind : "");
}

$("back").addEventListener("click", async () => {
  leaving = true;
  clearTimeout(pictureTimer);
  clearTimeout(reconnectTimer);
  if (room) { await room.disconnect(); room = null; }
  $("video").srcObject = null;
  show("list");
  refresh();
  poll = setInterval(refresh, 5000);
});

fetch("/healthz").then(r => r.json()).then(h => {
  $("ver").textContent = `版本 ${h.version}` + (h.configured ? "" : " · ⚠ 服务端未配置 LiveKit");
}).catch(() => {});

show("list");
refresh();
poll = setInterval(refresh, 5000);
</script>
</body>
</html>
